locale = 'en-us'
title = 'Python Lecture'
staticDir = ['fonts']
enableGitInfo = true

[module]

[[module.mounts]]
source = "node_modules/material-icons/iconfont"
target = "static/material-icons/iconfont"

[[module.mounts]]
source = 'static'
target = 'static'

# the lectures are written as raw html pages, and hugo denies the
# text/html content format by default since v0.16x
[security]
allowContent = ['^text/html$', '^text/markdown$']
